<aside class="po-rail"><img src="assets/post-office/logo-white.png" alt="The Post Office" width="155" height="105"><p>Production workspace</p><nav aria-label="Workspace"><button data-page="calendar">Calendar</button><button data-page="projects">Projects &amp; quotes</button><button data-page="checklists">SOP checklists</button><button data-page="crew">Crew</button><button data-page="hours">Work hours</button><button data-page="settings">Settings</button></nav><a href="index.html?standard=1">Back to TurnKey</a></aside>
