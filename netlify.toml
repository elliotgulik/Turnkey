[build]
  command = "node scripts/generate-config.js"
  publish = "."

# Real files (index.html, booking.html) are served directly.
# Unknown paths fall back to the CRM app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  # config.js intentionally contains a public, HTTP-referrer-restricted
  # Google Maps API key (see config.js's own header comment) — without this,
  # Netlify's build-time secrets scanner flags it as a leaked secret (it
  # matches the TURNKEY_MAPS_KEY env var value) and can fail the deploy.
  SECRETS_SCAN_OMIT_PATHS = "config.js"
