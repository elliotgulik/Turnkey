[build]
  command = "node scripts/generate-config.js"
  publish = "."

# Real files (index.html, booking.html) are served directly — Netlify
# always serves an existing file before falling through to a redirect rule,
# so this happens automatically. OneSignalSDKWorker.js is called out
# explicitly anyway (rather than relying on that implicit behaviour alone)
# because getting this wrong has a specific, easy-to-reintroduce failure
# mode: if this file is ever accidentally removed/renamed, the catch-all
# below silently starts serving index.html's HTML at this URL instead of a
# 404 — which is exactly what happened before this file existed. OneSignal
# then fails with "unsupported MIME type ('text/html')" instead of a
# clear 404, so this explicit passthrough makes the intent unmistakable
# instead of depending entirely on redirect-ordering behaviour.
[[redirects]]
  from = "/OneSignalSDKWorker.js"
  to = "/OneSignalSDKWorker.js"
  status = 200

# Unknown paths fall back to the CRM app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  # config.js intentionally contains a public, HTTP-referrer-restricted
  # Google Maps API key (see config.js's own header comment) — without this,
  # Netlify's build-time secrets scanner flags it as a leaked secret (it
  # matches the TURNKEY_MAPS_KEY env var value) and can fail the deploy.
  SECRETS_SCAN_OMIT_PATHS = "config.js"
