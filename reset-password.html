<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Reset your password · TurnKey</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="reset-password.css?v=20261103a">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="reset-password.js?v=20261103a" defer></script>
</head>
<body>
<main class="reset-card">
  <a class="brand" href="/" aria-label="TurnKey home">Turn<span>Key</span></a>
  <h1 id="reset-title">Reset your password</h1>
  <p id="reset-description">Enter your account email. We’ll send you a link to choose a new password.</p>
  <p id="reset-status" role="status" aria-live="polite"></p>
  <form id="reset-request">
    <label for="reset-email">Email address</label>
    <input id="reset-email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="254" autofocus>
    <button type="submit" id="reset-send">Send reset link</button>
  </form>
  <form id="reset-change" hidden>
    <label for="reset-password">New password</label>
    <input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="password-hint">
    <small id="password-hint">Use at least 8 characters. A longer, unique password is best.</small>
    <label for="reset-confirm">Confirm new password</label>
    <input id="reset-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
    <label class="show-password"><input id="reset-show" type="checkbox"> Show passwords</label>
    <button type="submit" id="reset-save">Save new password</button>
  </form>
  <div id="reset-success" hidden><a class="primary-link" href="/">Continue to TurnKey</a></div>
  <button type="button" class="secondary" id="reset-another" hidden>Request a new reset link</button>
  <a class="back" href="/">Back to sign in</a>
</main>
</body>
</html>
